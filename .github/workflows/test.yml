name: My Library tests

on:
  pull_request:
  push:
    branches:
      - main
      - fix/prevent-duplicate-editions

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check _worker.js
          node --check library.js
          node --check goodreads-preview.mjs
          node --check goodreads-ui.mjs
          node --check goodreads-import.mjs
          node --check goodreads-import-api.mjs
          node --check goodreads-reconciliation.mjs
          node --check shelf-photo-matcher.mjs
      - name: Node tests
        run: npm test
      - name: SQLite schema tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
